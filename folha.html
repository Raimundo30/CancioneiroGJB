<!DOCTYPE html>
<html lang="pt">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Folha de Cânticos</title>
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		
		<header id="folha-header">
			<a href="index.html" id="btn-voltar">← Cancioneiro</a>
			<div id="folha-header-info">
				<div id="folha-titulo-linha">
					<h1 id="folha-titulo"></h1>
					<button id="btn-editar-titulo" title="Editar título">✎</button>
				</div>
				<div id="folha-meta"></div>
			</div>
			<div id="folha-header-acoes">
				<button id="btn-modo-editar" class="btn-modo ativo">Editar</button>
				<button id="btn-modo-apresentar" class="btn-modo">Apresentar</button>
				
				<!-- Só visível no modo apresentar -->
				<div id="folha-nav-tipo" class="oculto">
					<button class="opcao-toggle ativo" id="btn-nav-continuo">Contínuo</button>
					<button class="opcao-toggle" id="btn-nav-individual">Individual</button>
				</div>
			</div>
		</header>

		<!-- Barra de navegação individual — só visível no modo apresentar individual -->
		<div id="folha-nav-momentos" class="oculto">
			<button id="btn-momento-anterior">‹</button>
			<div id="folha-nav-label-container">
				<button id="folha-nav-label">...</button>
				<ul id="folha-nav-dropdown" class="oculto"></ul>
			</div>
			<button id="btn-momento-seguinte">›</button>
		</div>

		<main id="folha-conteudo">
			<!-- preenchido pelo folha.js -->
		</main>

		<script src="preferencias.js"></script>
		<script src="parser.js"></script>
		<script src="folhas.js"></script>
		<script src="painel-folhas.js"></script>
		<script src="painel.js"></script>
		<script src="definicoes.js"></script>
		<script src="folha.js"></script>

	</body>
</html>
