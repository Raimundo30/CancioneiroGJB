<!-- <button id="btn-definicoes" title="Definições">⚙</button> -->

<div id="painel-definicoes" class="painel-fechado">
	<div id="painel-interior">

		<div id="painel-cabecalho">
			<h2>Definições</h2>
			<button id="btn-fechar-painel">✕</button>
		</div>

		<!-- Secção de definições gerais -->
		<div id="painel-definicoes-gerais">
			<div class="definicao-grupo">
				<label>Acordes</label>
				<div class="opcoes-toggle">
					<button class="opcao-toggle" data-pref="mostrarAcordes" data-valor="true">Mostrar</button>
					<button class="opcao-toggle" data-pref="mostrarAcordes" data-valor="false">Ocultar</button>
				</div>
			</div>
  			<div class="definicao-grupo">
				<label>Notação de acordes</label>
				<div class="opcoes-toggle">
					<button class="opcao-toggle" data-pref="notacao" data-valor="anglo">CDEFGAB</button>
					<button class="opcao-toggle" data-pref="notacao" data-valor="latino">DóRéMi</button>
				</div>
			</div>
		</div>

		<!-- Secção de definições de folhas -->
		<div id="painel-definicoes-folha" style="display: none;">
			<hr class="painel-separador">
			<div class="painel-secao-titulo">Vista da Folha</div>
			
			<div class="definicao-grupo">
				<div class="toggle">
					<span>Editar folha</span>
					<label class="switch">
						<input type="checkbox" id="toggle-folha-editar">
						<span class="slider round"></span>
					</label>
				</div>
			</div>

			<div class="definicao-grupo" id="opt-folha-pagina" class="oculto">
				<div class="toggle">
					<span>Ver por página</span>
					<label class="switch">
						<input type="checkbox" id="toggle-folha-pagina">
						<span class="slider round"></span>
					</label>
				</div>
			</div>

			<div class="definicao-grupo">
				<div class="toggle">
					<span>Ocultar meta</span>
					<label class="switch">
						<input type="checkbox" id="toggle-folha-meta">
						<span class="slider round"></span>
					</label>
				</div>
			</div>
		</div>

	</div>
</div>

<div id="overlay-definicoes"></div>
