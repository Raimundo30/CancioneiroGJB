<!-- <button id="btn-definicoes" title="Definições">⚙</button> -->

<div id="painel-definicoes" class="painel-fechado">
	<div id="painel-interior">

		<div id="painel-cabecalho">
			<h2>Definições</h2>
			<button id="btn-fechar-painel">✕</button>
		</div>


		<!-- Secção de definições gerais -->
		<div id="painel-definicoes-gerais">
			<div class="definicao-grupo">
				<label>Acordes</label>
				<div class="opcoes-toggle">
					<button class="opcao-toggle" data-pref="mostrarAcordes" data-valor="true">Mostrar</button>
					<button class="opcao-toggle" data-pref="mostrarAcordes" data-valor="false">Ocultar</button>
				</div>
			</div>
			<div class="definicao-grupo">
				<label>Notação de acordes</label>
				<div class="opcoes-toggle">
					<button class="opcao-toggle" data-pref="notacao" data-valor="anglo">CDEFGAB</button>
					<button class="opcao-toggle" data-pref="notacao" data-valor="latino">DóRéMi</button>
				</div>
			</div>
		</div>

		<!-- Secção de definições de visualização -->
		<div id="painel-definicoes-visualizacao">
			<hr class="painel-separador">
			<div class="painel-secao-titulo">Visualização</div>
			
			<!-- Full screen -->
			<div class="definicao-grupo toggle">
				<span>Full Screen</span>
				<label class="switch">
					<input type="checkbox" id="toggle-fullscreen">
					<span class="slider round"></span>
				</label>
			</div>

			<!-- ver por página -->
			<div class="definicao-grupo toggle folha" style="display: none;">
				<span>Ver por página</span>
				<label class="switch">
					<input type="checkbox" id="toggle-verPaginas">
					<span class="slider round"></span>
				</label>
			</div>

			<!-- Ocultar meta -->
			<div class="definicao-grupo toggle folha cantico" style="display: none;">
				<span>Ocultar meta</span>
				<label class="switch">
					<input type="checkbox" id="toggle-meta">
					<span class="slider round"></span>
				</label>
			</div>
		</div>

		<!-- Secção de definições de Admin -->
		<div id="painel-definicoes-admin">
			<hr class="painel-separador">
			<!-- <div class="painel-secao-titulo">Admin</div> -->

			<!-- Admin -->
			<div class="definicao-grupo toggle">
				<span>Admin</span>
				<label class="switch">
					<input type="checkbox" id="toggle-admin">
					<span class="slider round"></span>
				</label>
			</div>

			<!-- Adicionar novo cântico -->
			<div id="novo-cantico" class="folha cantico" style="display: none;">
				<button class="btn-normal btn-texto" id="btn-novo-cantico">Adicionar Novo Cântico</button>
			</div>

			<!-- Apagar cântico --><!-- move cântico para "canticos-apagados"-->
			<div id="apagar-cantico" class="cantico" style="display: none;">
				<button class="btn-normal btn-texto" id="btn-apagar-cantico">Apagar Cântico</button>
			</div>
		</div>

	</div>
</div>

<div id="overlay-definicoes"></div>
