<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Folha de Cânticos</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1WRP9RXLEM"></script>
    <script>window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());

		gtag('config', 'G-1WRP9RXLEM');</script>

</head>

<body>
    <header class="header-grid">
        <div class="header-info">
            <button id="btn-voltar" class="btn-transparente btn-voltar">← Voltar</button>
            <div id="folha-titulo-linha">
                <h1 id="folha-titulo"></h1>
                <div class="btn-header btn-normal">
                    <button id="btn-editar-folha" title="Editar título">✎</button>
                </div>
            </div>
            <div id="folha-meta"></div>
        </div>

        <div class="btn-header btn-normal">
            <button id="btn-definicoes" title="Definições">⚙</button>
            <button id="btn-apagar-folha" title="Apagar folha" class="btn-apagar">🗑️</button>
            <button id="btn-visualizar-folha" title="Visualizar Folha">👁️</button>
            <nav-comp id="nav-comp" class="oculto"></nav-comp>
        </div>
    </header>

    <main id="folha-conteudo">
        <!-- preenchido pelo editor-folha.js -->
    </main>

    <script type="module" src="db-init.js"></script>
    <script src="preferencias.js" defer></script>
    <script src="componentes.js" defer></script>
    <script src="pesquisa.js" defer></script>
    <script src="painel.js" defer></script>
    <script src="parser.js" defer></script>
    <script src="folhas.js" defer></script>
    <script src="editor-folha.js" defer></script>
</body>
</html>
