<!DOCTYPE html>

<html lang="pt">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Cântico</title>
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		<header class="header-grid">
			<div class="header-info">
				<!-- <a href="index.html" id="btn-voltar">← Voltar</a> -->
				<button onclick="location.reload();location.href='index.html'" class="btn-transparente btn-voltar">← Voltar</button>
				
				<h1 id="cantico-titulo">A carregar...</h1>
				<h2 id="cantico-subtitulo"></h2>
				<div id="cantico-meta">
					<span id="cantico-autor"></span>
					<span id="cantico-tom"></span>
					<span id="cantico-categorias"></span>					
				</div>
			</div>

			<div class="btn-header btn-normal">
				<!-- Botão de definições -->
				<button id="btn-definicoes" title="Definições">⚙</button>
				<!-- Componente de navegação -->
				<nav-comp id="nav-comp"></nav-comp>
			
		</header>

		<main id="cantico-conteudo">
			<div class="btn-main btn-normal">
				<!-- Componente de transposição -->
				<transp-comp id="transp-comp" class="oculto"></transp-comp>
			</div>
			<div id="cantico-letra"> <!-- Preenchido pelo cantico.js --> </div>
		</main>

		<script type="module" src="db-init.js"></script>
		<script src="preferencias.js" defer></script>
		<script src="parser.js" defer></script>
		<script src="folhas.js" defer></script>
		<script src="painel.js" defer></script>
		<script src="definicoes.js" defer></script>
		<script src="pesquisa.js" defer></script>
		<script src="cantico.js" defer></script>
		<script src="componentes.js" defer></script>
    
	</body>
</html>
